# .github/workflows/pages.yml
name: Deploy Pages

on:
  workflow_dispatch:
  push:
    branches: [ main ]   # <-- change if your default branch isn't 'main'
    paths:
      - "**/*.html"
      - "assets/**"
      - "images/icons/**"
      - "ceec/**"
      - ".github/workflows/pages.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # --- Only stage what you actually want to publish ---
      - name: Stage site (whitelist copy only)
        run: |
          set -euo pipefail
          rm -rf _site && mkdir -p _site

          # Copy root HTML files (adjust list if needed)
          shopt -s nullglob
          for f in *.html; do
            cp -v "$f" _site/
          done

          # Assets (css/js/fonts) — safe/light
          if [ -d assets ]; then
            mkdir -p _site/assets
            rsync -av --delete assets/ _site/assets/
          fi

          # Icons only (NOT full image library)
          if [ -d images/icons ]; then
            mkdir -p _site/images/icons
            rsync -av images/icons/ _site/images/icons/
          fi

          # CEEC pages (html + light images you keep here)
          if [ -d ceec ]; then
            mkdir -p _site/ceec
            rsync -av ceec/ _site/ceec/
          fi

          # If you aren't using Jekyll features:
          touch _site/.nojekyll

          echo "—— Largest paths in _site ——"
          du -h -d 2 _site | sort -h | tail -n 25

      # --- Hard stop if the staged site is too large ---
      - name: Size gate
        run: |
          BYTES=$(du -sb _site | cut -f1)
          LIMIT=$((950*1024*1024))   # ~950 MB safety margin
          echo "Site size: $BYTES bytes"
          if [ "$BYTES" -gt "$LIMIT" ]; then
            echo "❌ _site exceeds 950MB. Refusing to deploy."
            du -h -d 2 _site | sort -h | tail -n 25
            exit 1
          fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
