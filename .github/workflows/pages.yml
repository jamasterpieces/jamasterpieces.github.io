- name: Stage site (whitelist copy only)
  run: |
    set -e
    rm -rf _site && mkdir -p _site

    # ---- Root HTML files you actually want live ----
    for f in index.html photography.html ceec.html expressions.html; do
      [ -f "$f" ] && cp -v "$f" _site/ || true
    done

    # ---- Copy only the folders you intend to serve ----
    # assets (css/js/fonts)
    mkdir -p _site/assets
    [ -d assets ] && rsync -av assets/ _site/assets/

    # icons (not full image library)
    mkdir -p _site/images/icons
    [ -d images/icons ] && rsync -av images/icons/ _site/images/icons/

    # CEEC pages (html + light images)
    mkdir -p _site/ceec
    [ -d ceec ] && rsync -av ceec/ _site/ceec/

    # Example: copy gallery thumbs + web-sized, but NOT fullres/originals
    # Uncomment and tailor these to your structure:
    # mkdir -p _site/images/ceec-classic/thumbs _site/images/ceec-classic/full
    # rsync -av images/ceec-classic/thumbs/ _site/images/ceec-classic/thumbs/
    # rsync -av images/ceec-classic/full/   _site/images/ceec-classic/full/

    # If you aren't using Jekyll features:
    touch _site/.nojekyll

    echo "—— Largest paths in _site ——"
    du -h -d 2 _site | sort -h | tail -n 25

      # 👇 Hard stop if the staged site is too large
      - name: Size gate
        run: |
          BYTES=$(du -sb _site | cut -f1)
          LIMIT=$((950*1024*1024))   # ~950 MB safety margin
          echo "Site size: $BYTES bytes"
          if [ "$BYTES" -gt "$LIMIT" ]; then
            echo "❌ _site exceeds 950MB. Refusing to deploy."
            du -h -d 2 _site | sort -h | tail -n 25
            exit 1
          fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
