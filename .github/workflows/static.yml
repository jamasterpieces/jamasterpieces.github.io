name: Deploy to Pages

on:
  push:
    branches: [ main ]   # ← change if your default branch isn’t main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

     - name: Stage site files (exclude heavy/dev stuff)
  run: |
    set -e
    rm -rf _site
    mkdir -p _site
    # Copy EVERYTHING, but skip junk/dev folders & huge files
    rsync -a ./ _site/ \
      --delete \
      --exclude '.git/' \
      --exclude '.github/' \
      --exclude 'node_modules/' \
      --exclude '.vscode/' \
      --exclude 'raw/' \
      --exclude 'originals/' \
      --exclude 'uploads_raw/' \
      --exclude '*.psd' \
      --exclude '*.zip' \
      --exclude '*.mov' \
      --exclude '*.mp4'

    # Ensure these core files are present at the root (safe if they don't exist)
    cp -f CNAME _site/ 2>/dev/null || true
    cp -f 404.html _site/ 2>/dev/null || true
      - name: Show staged size
        run: du -sh _site || true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
