# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
  - name: Checkout
    uses: actions/checkout@v4

  - name: Setup Pages
    uses: actions/configure-pages@v5

  - name: Stage site files (runner only)
    run: |
      set -e
      rm -rf _site
      mkdir -p _site
      # Include only the files/folders you actually serve:
      cp -f index.html _site/ 2>/dev/null || true
      cp -f 404.html _site/ 2>/dev/null || true
      cp -f CNAME _site/ 2>/dev/null || true

      # Copy your public folders. Adjust this list to match your site.
      for d in ceec images css js assets; do
        [ -d "$d" ] && rsync -a "$d"/ "_site/$d"/
      done

  - name: Upload artifact
    uses: actions/upload-pages-artifact@v3
    with:
      path: ./_site

  - name: Deploy to GitHub Pages
    id: deployment
    uses: actions/deploy-pages@v4
