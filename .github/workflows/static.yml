name: Deploy to Pages

on:
  push:
    branches: [ main ]   # ← change if your default branch isn’t main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Stage site files (runner only)
        run: |
          set -e
          rm -rf _site
          mkdir -p _site
          # Include only the files/folders you actually serve:
          cp -f index.html _site/ 2>/dev/null || true
          cp -f 404.html _site/ 2>/dev/null || true
          cp -f CNAME _site/ 2>/dev/null || true

          # Copy your public folders. Adjust this list to match your site.
          for d in ceec images css js assets; do
            if [ -d "$d" ]; then
              mkdir -p "_site/$d"
              rsync -a "$d"/ "_site/$d"/ || cp -r "$d"/ "_site/$d"/
            fi
          done

      - name: Show staged size
        run: du -sh _site || true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
